name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Java 25 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 9.6.0 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Mod bauen
        run: gradle build --stacktrace

      - name: Fertige Mod-Datei hochladen
        uses: actions/upload-artifact@v4
        with:
          name: throwing-discs-mod
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
